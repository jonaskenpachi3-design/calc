# Limites de memória: cada serviço tem teto de contêiner (mem_limit) e a JVM, um teto de heap menor
# (-Xmx), para um serviço não derrubar os outros por falta de memória. Ajuste pelo .env:
#   MEM_JAVA e JAVA_XMX (os dois serviços Java), MEM_DANFSE, MEM_GATEWAY.
# Soma dos tetos padrão: cerca de 2,5 GiB. No Docker Desktop, dê ao menos 4 GiB ao Docker.
# Somente o gateway publica porta. Os três serviços oficiais não têm autenticação
# própria e ficam na rede interna.
services:
  db-init:
    build:
      context: ./vendor/calculadora-rtc-regime-regular
      dockerfile: ../../docker/java.Dockerfile
      target: dbinit
    volumes:
      - calc-db:/out
    restart: "no"

  regime-regular:
    build:
      context: ./vendor/calculadora-rtc-regime-regular
      dockerfile: ../../docker/java.Dockerfile
      args: { JAR: api-regime-geral.jar }
    mem_limit: ${MEM_JAVA:-1g}
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx${JAVA_XMX:-512m} -XX:+ExitOnOutOfMemoryError"
    volumes:
      - calc-db:/app/calculadora/db:ro
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: unless-stopped

  simples-nacional:
    build:
      context: ./vendor/calculadora-rtc-simples-nacional
      dockerfile: ../../docker/java.Dockerfile
      args: { JAR: api-simples-nacional.jar }
    mem_limit: ${MEM_JAVA:-1g}
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx${JAVA_XMX:-512m} -XX:+ExitOnOutOfMemoryError"
    volumes:
      - calc-db:/app/calculadora/db:ro
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: unless-stopped

  danfse:
    build: ./vendor/calculadora-rtc-gerador-danfse
    mem_limit: ${MEM_DANFSE:-192m}
    environment:
      GOMEMLIMIT: 150MiB
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports:
      - "${PORT:-3000}:3000"
    mem_limit: ${MEM_GATEWAY:-256m}
    environment:
      NODE_OPTIONS: "--max-old-space-size=192"
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET (32+ caracteres) no .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?defina ADMIN_TOKEN no .env}
      STORE_PAYLOADS: ${STORE_PAYLOADS:-false}
      UPSTREAM_REGIME_REGULAR: http://regime-regular:8080
      UPSTREAM_SIMPLES_NACIONAL: http://simples-nacional:8082
      UPSTREAM_DANFSE: http://danfse:8080
    volumes:
      - saas-data:/data
    depends_on: [regime-regular, simples-nacional, danfse]
    restart: unless-stopped

volumes:
  calc-db:
  saas-data:
